[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zpiz-agent-cli"
version = "0.1.0"
description = "Local filesystem agent with shared PostgreSQL identity and Bifrost models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "rich>=13,<15", "platformdirs>=4,<5", "Pillow>=11,<13", "pypdf>=5,<7", "pypdfium2>=4.30,<6", "keyring>=25,<27", "psutil>=6,<8", "filelock>=3,<4", "jsonschema>=4,<5", "pywinpty>=2,<4; sys_platform == 'win32'"]

[project.scripts]
agent-cli = "agent_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_cli = ["*.sql"]
